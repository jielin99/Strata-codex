# Copy to $CODEX_HOME/strata.config.toml and run: codex --profile strata
# Change this path and the context limits to match your checkout and Strata config.
model = "strata-local"
model_provider = "strata"
model_catalog_json = "F:/Tmp/Strata/docs/codex-models.json"
model_context_window = 32768
model_auto_compact_token_limit = 24000
model_reasoning_effort = "medium"
web_search = "disabled"

[model_providers.strata]
name = "Strata local"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
# If Strata was started with --api-key, uncomment and set this environment variable:
# env_key = "STRATA_API_KEY"
